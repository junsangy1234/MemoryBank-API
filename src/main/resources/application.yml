server:
  tomcat:
    max-http-form-post-size: 10MB

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: '1234'
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  ai:
    openai:
      embedding:
        options:
          model: "text-embedding-3-small"

lemon-squeezy:
  webhook-secret: ${LEMON_SQUEEZY_SECRET}

spring.ai.openai.api-key: ${OPENAI_API_KEY}rm -rf .git



logging:
  level:
    org.hibernate.SQL: debug